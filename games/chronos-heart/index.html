<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сердце Хроноса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. Top bar, square SVG stage, inventory tray. Single dark look by design. */
:root{
  --soot:#120b07; --char:#1d130c; --brass:#d6a64e; --brass-hi:#f4d68f; --parch:#ead7ac; --ember:#e8752a;
  --line:rgba(214,166,78,.32);
  --display:'Cormorant SC','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Segoe Script','Comic Sans MS',cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--soot);color:var(--parch);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 42%,#2b1b10 0%,#120b07 70%)}
#top{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;
  background:linear-gradient(#24170e,#170f09);border-bottom:1px solid var(--line)}
#loc{flex:1;min-width:0;text-align:center;font:600 21px/1.1 var(--display);letter-spacing:.09em;color:var(--brass-hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--brass);
  background:radial-gradient(circle at 35% 30%,#5b3d1b,#24170c 75%);color:var(--brass-hi);
  font:700 20px/1 var(--display);display:grid;place-items:center;cursor:pointer;padding:0}
.btn:focus-visible,.slot:focus-visible,.cta:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn svg{width:22px;height:22px}
.btn.off{opacity:.45}
.spacer{width:42px;flex:0 0 auto}
#stage{flex:1 1 auto;position:relative;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 32px),640px);box-sizing:border-box;
  padding:14px 18px 12px;background:rgba(18,11,6,.9);border:1px solid rgba(214,166,78,.55);border-radius:3px;
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 4px rgba(214,166,78,.07);cursor:pointer;animation:msgIn .35s ease}
#msg p{margin:0;font:500 19px/1.38 var(--body);color:var(--parch);text-wrap:pretty}
#msg .more{display:block;margin-top:6px;text-align:right;font:500 13px/1 var(--display);letter-spacing:.14em;color:var(--brass)}
@keyframes msgIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#inv{flex:0 0 auto;display:flex;justify-content:center;gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#170f09,#0d0805);border-top:1px solid var(--line)}
.slot{width:64px;height:64px;border-radius:8px;border:1px solid rgba(214,166,78,.35);padding:4px;box-sizing:border-box;
  background:radial-gradient(circle at 50% 40%,#2e1f13,#120b07 80%);cursor:pointer;transition:box-shadow .2s,transform .2s}
.slot svg{width:100%;height:100%;display:block}
.slot.sel{box-shadow:0 0 0 2px var(--brass-hi),0 0 22px rgba(244,214,143,.55);transform:translateY(-3px)}
.slot.new{animation:newItem 1s ease}
@keyframes newItem{0%{transform:scale(.6)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* SVG animation helpers */
#scene.fade{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 40s linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes swing{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
.swing{animation:swing 2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.9}20%{opacity:.78}45%{opacity:.95}60%{opacity:.82}80%{opacity:1}}
.flick{animation:flick 3.2s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.06,.94)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .9s ease-in-out infinite}
@keyframes rain{from{transform:translate(0,-80px)}to{transform:translate(-26px,380px)}}
.rain{animation:rain .9s linear infinite}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.55}100%{opacity:0;transform:translate(-14px,-80px) scale(2.4)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 3.4s ease-out infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}25%{opacity:.8}100%{transform:translate(30px,-120px);opacity:0}}
.dust{animation:dust 9s linear infinite}
@keyframes glint{0%,70%,100%{opacity:0;transform:scale(.2) rotate(0)}82%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{transform-box:fill-box;transform-origin:center;animation:glint 3.6s ease-in-out infinite;pointer-events:none}
@keyframes needle{0%,100%{transform:rotate(-30deg)}40%{transform:rotate(-12deg)}70%{transform:rotate(-24deg)}}
.needle{animation:needle 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.dashpulse{animation:dash 1.2s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .45s ease}
.train.run .gA{animation:spin 1.8s linear infinite}
.train.run .gB{animation:spin 1.8s linear infinite reverse}
.hand{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.kn{transition:transform .3s ease}
.door{transition:transform 1.1s cubic-bezier(.55,0,.2,1)}
.door.open{transform:scaleX(.06)}
.ring{transition:transform .45s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.prot{transition:transform .25s ease}
.tile{cursor:pointer}
.tile .pg{opacity:0;stroke-dasharray:14 18}
.tile.on .pm{stroke:#cf6f2e}
.tile.on .pg{opacity:.9;animation:dash .7s linear infinite}
.book{transition:transform .25s ease;cursor:pointer}
.book .shade{opacity:0;transition:opacity .25s}
.book.in{transform:translateY(6px)}
.book.in .shade{opacity:.5}
.hdoor{transition:transform 1.6s cubic-bezier(.6,0,.2,1),opacity 1.6s}
.hdoor.open{transform:scaleX(.04);opacity:.2}
.wheel.turn{animation:spin 2.2s cubic-bezier(.5,0,.3,1) 1}
.medal.turn{animation:spin 1.4s ease-in-out 1}
.turbine.on{animation:spin 1.2s linear infinite}
.gauge-n{transition:transform 2s cubic-bezier(.3,1.4,.5,1)}
.hot{cursor:pointer}
.cta{cursor:pointer}
.cta:hover rect.face{filter:brightness(1.12)}
@media (prefers-reduced-motion:reduce){
  .spin,.swing,.rain,.puff,.dust,.glint,.needle,.pulse,.bob,.flick,.flame,.dashpulse{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">

        <radialGradient id="brassD" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#b58a4a"/><stop offset=".5" stop-color="#6e4a22"/><stop offset="1" stop-color="#2e1c0a"/></radialGradient>
        <radialGradient id="rivet" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff3cf"/><stop offset=".4" stop-color="#c99a4a"/><stop offset="1" stop-color="#3e260c"/></radialGradient>

          <circle cx="0" cy="60" r="5" fill="#d9b070" opacity=".06"/><circle cx="90" cy="60" r="5" fill="#d9b070" opacity=".06"/>
        </pattern>
        <linearGradient id="woodV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f2e18"/><stop offset="1" stop-color="#2a170b"/></linearGradient>
        <linearGradient id="woodH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a170b"/><stop offset=".5" stop-color="#55331b"/><stop offset="1" stop-color="#2a170b"/></linearGradient>
        <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e2212"/><stop offset="1" stop-color="#6e4224"/></linearGradient>

        <linearGradient id="mahog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a321a"/><stop offset=".5" stop-color="#55200f"/><stop offset="1" stop-color="#2e1108"/></linearGradient>
        <linearGradient id="mahogTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e170b"/><stop offset="1" stop-color="#83391d"/></linearGradient>
        <radialGradient id="ivory" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#efe0bd"/><stop offset="1" stop-color="#c9ad78"/></radialGradient>
        <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e6c2"/><stop offset=".5" stop-color="#e9d4a3"/><stop offset="1" stop-color="#d2b47a"/></linearGradient>
        <radialGradient id="parchEdge" r=".72"><stop offset=".62" stop-color="#6b3d14" stop-opacity="0"/><stop offset="1" stop-color="#6b3d14" stop-opacity=".55"/></radialGradient>
        <radialGradient id="warm"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset=".45" stop-color="#ff9a3a" stop-opacity=".16"/><stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/></radialGradient>
        <radialGradient id="vig" r=".5"><stop offset=".38" stop-color="#000" stop-opacity="0"/><stop offset=".68" stop-color="#000" stop-opacity=".62"/><stop offset=".9" stop-color="#000" stop-opacity=".95"/><stop offset="1" stop-color="#000"/></radialGradient>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset=".6" stop-color="#142640"/><stop offset="1" stop-color="#2d3d52"/></linearGradient>
        <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1638"/><stop offset=".35" stop-color="#6a2c4a"/><stop offset=".62" stop-color="#d0603a"/><stop offset=".8" stop-color="#f4b25a"/><stop offset="1" stop-color="#f7d38a"/></linearGradient>

        <radialGradient id="varnish" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#fff2c8" stop-opacity=".1"/><stop offset="1" stop-color="#3a1a00" stop-opacity=".5"/></radialGradient>
        <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".02"/><stop offset=".55" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="ringG0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efca7c"/><stop offset=".5" stop-color="#a87634"/><stop offset="1" stop-color="#e1b45e"/></linearGradient>

<script>
'use strict';
const $ = s => document.querySelector(s);
const svgEl = $('#view'), sceneG = $('#scene');
const msgEl = $('#msg'), msgText = $('#msgText'), msgMore = $('#msgMore');
const f1 = n => Math.round(n * 10) / 10;
const rad = d => d * Math.PI / 180;
const RN = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
const SAVE_KEY = 'chronos-heart-v1';

/* ---------------- state ---------------- */
function freshState(){
  return { inv:[], sel:null, f:{}, hs:0, ms:0, rs:[0,0,0], pr:PIPE_SOL.map((t,i)=>t[1]+PIPE_SCR[i]),
    shelf:0, lens:[500,470], t0:Date.now(), tEnd:0, scene:'title', started:false };
}
const PIPE_SOL = [['c',1],['s',0],['c',2],['s',1], ['s',1],['c',2],['c',1],['c',2], ['c',3],['c',0],['c',3],['c',0], ['s',0],['c',1],['s',1],['c',3]];
const PIPE_SCR = [1,1,3,2, 1,2,1,3, 0,1,2,3, 1,3,2,1];
const RINGS = [['sun','moon','star','tri','wave','earth'],['wave','earth','sun','star','moon','tri'],['moon','tri','earth','wave','sun','star']];
const CODE = ['moon','star','tri'];
let S = freshState();
let soundOn = true;
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.f) S = Object.assign(freshState(), d); } } catch(e) {}
try { soundOn = localStorage.getItem(SAVE_KEY + '-snd') !== '0'; } catch(e) {}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------------- audio (synthesised) ---------------- */
const AU = {
  ctx:null, master:null, rain:null,
  init(){
    try{
      if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
        this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = .7; this.master.connect(this.ctx.destination); }
      if(this.ctx.state === 'suspended') this.ctx.resume();
      this.ambient();
    }catch(e){}
  },
  ok(){ return soundOn && this.ctx; },
  tone(f,d,type='sine',v=.12,dl=0,f2){
    if(!this.ok()) return; const c=this.ctx, t=c.currentTime+dl, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.05);
  },
  noiseBuf(sec){ const c=this.ctx, len=Math.floor(c.sampleRate*sec), b=c.createBuffer(1,len,c.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<len;i++) a[i]=Math.random()*2-1; return b; },
  noise(d,v=.2,freq=1000,type='bandpass',dl=0){
    if(!this.ok()) return; const c=this.ctx, t=c.currentTime+dl, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.noiseBuf(d); fl.type=type; fl.frequency.value=freq;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t);
  },
  ambient(){
    if(!this.ctx) return;
    if(!this.rain){
      const c=this.ctx, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain();
      s.buffer=this.noiseBuf(4); s.loop=true; fl.type='lowpass'; fl.frequency.value=900; g.gain.value=0;
      s.connect(fl); fl.connect(g); g.connect(this.master); s.start(); this.rain=g;
    }
    this.rain.gain.setTargetAtTime(soundOn ? .045 : 0, this.ctx.currentTime, .4);
  },
  click(){ this.tone(2600,.025,'square',.025); this.tone(620,.07,'triangle',.09); },
  tick(soft){ this.tone(soft?1300:1700,.03,'square',soft?.01:.028); this.tone(soft?300:380,.05,'triangle',soft?.02:.05); },
  clank(){ this.noise(.28,.35,480); this.tone(120,.35,'sawtooth',.06,0,55); },
  chime(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ this.tone(f,1.6,'sine',.09,i*.13); this.tone(f*2.01,.7,'sine',.02,i*.13); }); },
  pick(){ this.tone(880,.25,'sine',.08); this.tone(1320,.35,'sine',.06,.08); },

/* ---------------- drawing helpers ---------------- */
function rng(seed){ let s=seed; return ()=> (s = (s*16807) % 2147483647) / 2147483647; }
function gearPath(cx,cy,ro,ri,n){
  let d=''; const st=Math.PI*2/n;
  for(let i=0;i<n;i++){ const a=i*st-Math.PI/2;
    [[a,ri],[a+st*.16,ro],[a+st*.46,ro],[a+st*.62,ri]].forEach(([an,r],j)=>{
      d+=(i===0&&j===0?'M':'L')+f1(cx+Math.cos(an)*r)+','+f1(cy+Math.sin(an)*r); });
  }
  return d+'Z';
}
function gear(cx,cy,r,n,o={}){
  const ri=r*.84, cls=[o.cls||'', o.spin?'spin':'', o.rev?'rev':''].join(' ').trim();
  const st=`transform-origin:${cx}px ${cy}px;${o.spin?`animation-duration:${o.spin}s;`:''}`;
  let holes='';
  if(r>26 && !o.solid){ const k=o.holes||5; for(let i=0;i<k;i++){ const a=i*Math.PI*2/k; holes+=`<circle cx="${f1(cx+Math.cos(a)*r*.48)}" cy="${f1(cy+Math.sin(a)*r*.48)}" r="${f1(r*.15)}" fill="${o.hole||'#140b05'}"/>`; } }
  return `<g class="${cls}" style="${st}"${o.id?` id="${o.id}"`:''}${o.op?` opacity="${o.op}"`:''}>
    <path d="${gearPath(cx,cy,r,ri,n)}" fill="${o.fill||'url(#brass)'}" stroke="#3a240c" stroke-width="${o.sw||2}"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(ri*.8)}" fill="none" stroke="#4a2e0e" stroke-width="${f1(Math.max(1.5,r*.05))}" opacity=".55"/>
    ${holes}
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.2)}" fill="url(#brassR)" stroke="#3a240c" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.06)}" fill="#1a0f06"/>${o.extra||''}
  </g>`;
}
const rivet = (x,y,r=6) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="url(#rivet)" stroke="#2a1806" stroke-width="1"/>`;
function rivetRing(cx,cy,R,n,r=6,off=0){ let s=''; for(let i=0;i<n;i++){ const a=i*Math.PI*2/n+off; s+=rivet(cx+Math.cos(a)*R, cy+Math.sin(a)*R, r); } return s; }
function heartPath(cx,cy,s){
  return `M${f1(cx)},${f1(cy+s*.92)} C${f1(cx-s*1.45)},${f1(cy+s*.08)} ${f1(cx-s*.95)},${f1(cy-s*.95)} ${f1(cx)},${f1(cy-s*.36)} C${f1(cx+s*.95)},${f1(cy-s*.95)} ${f1(cx+s*1.45)},${f1(cy+s*.08)} ${f1(cx)},${f1(cy+s*.92)} Z`;
}
function heartObj(cx,cy,s,glow=true){
  return `<g>
    ${glow?`<circle cx="${cx}" cy="${cy}" r="${f1(s*2.3)}" fill="url(#warm)" class="pulse"/>`:''}

function glyph(n,x,y,s,col,sw=5){
  const h=s/2, g=`<g transform="translate(${f1(x)},${f1(y)})" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">`;
  switch(n){
    case 'sun': return g+`<circle r="${f1(h*.62)}"/><circle r="${f1(h*.13)}" fill="${col}"/></g>`;
    case 'moon': return g+`<path d="M${f1(h*.15)},${f1(-h*.7)} A${f1(h*.7)},${f1(h*.7)} 0 1 0 ${f1(h*.15)},${f1(h*.7)} A${f1(h*.55)},${f1(h*.75)} 0 0 1 ${f1(h*.15)},${f1(-h*.7)} Z" fill="${col}" stroke="none"/></g>`;
    case 'star': return g+`<path d="M0,${f1(-h*.78)} L${f1(h*.67)},${f1(h*.39)} L${f1(-h*.67)},${f1(h*.39)} Z M0,${f1(h*.78)} L${f1(h*.67)},${f1(-h*.39)} L${f1(-h*.67)},${f1(-h*.39)} Z"/></g>`;

    case 'wave': return g+`<path d="M${f1(-h*.7)},${f1(-h*.18)} q${f1(h*.175)},${f1(-h*.32)} ${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0 M${f1(-h*.7)},${f1(h*.26)} q${f1(h*.175)},${f1(-h*.32)} ${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0"/></g>`;
    case 'earth': return g+`<circle r="${f1(h*.62)}"/><path d="M0,${f1(-h*.62)} V${f1(h*.62)} M${f1(-h*.62)},0 H${f1(h*.62)}"/></g>`;
  }
  return '';
}

function placeLens(){

  if(l) l.setAttribute('transform',`translate(${x},${y})`);
  if(c){ c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',100); }
  if(Math.hypot(x-420,y-860)<95 && !S.f.sawCode){ S.f.sawCode=true; save(); AU.chime(); say('Под красным стеклом проступили знаки, написанные невидимыми чернилами!'); }
}
function toSvg(e){ const p=svgEl.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svgEl.getScreenCTM().inverse()); }
function mountLetter(){
  const c=$('#lensC'); if(c) c.setAttribute('cx',-500);
  if(S.sel!=='lens') return;
  placeLens();
  let drag=false;
  const move=e=>{ const p=toSvg(e); S.lens=[Math.max(90,Math.min(910,p.x-60)), Math.max(90,Math.min(930,p.y-60))]; placeLens(); };
  svgEl.onpointerdown=e=>{ if(S.scene!=='letter'||S.sel!=='lens') return; drag=true; try{svgEl.setPointerCapture(e.pointerId);}catch(_){} move(e); };
  svgEl.onpointermove=e=>{ if(drag) move(e); };
  svgEl.onpointerup=svgEl.onpointercancel=()=>{ if(drag){ drag=false; save(); } };
}

function pipeFlow(){
  const on=new Set(), q=[];
  const rot=i=>S.pr[i]%4, has=(i,d)=>conns(PIPE_SOL[i][0],rot(i)).includes(d);
  if(has(4,3)){ on.add(4); q.push(4); }
  while(q.length){ const i=q.shift(), r=Math.floor(i/4), c=i%4;
    conns(PIPE_SOL[i][0],rot(i)).forEach(d=>{ const nr=r+[-1,0,1,0][d], nc=c+[0,1,0,-1][d]; if(nr<0||nr>3||nc<0||nc>3) return;
      const j=nr*4+nc; if(!on.has(j) && has(j,(d+2)%4)){ on.add(j); q.push(j); } }); }
  return { on, win: on.has(11) && has(11,1) };
}
function updatePipes(){
  const {on,win}=pipeFlow();
  PIPE_SOL.forEach((_,i)=>{ const el=$('#tile'+i); if(el) el.classList.toggle('on',on.has(i)); });
  return win;
}

function go(n){
  if(!SC[n]) n='room';
  if(S.scene!==n) hideMsg();

  render(); save();
  if(n==='letter' && S.inv.includes('lens') && S.sel!=='lens' && S.f.gotLens && !S.f.sawCode) setTimeout(()=>say('Может, взглянуть на письмо через красную линзу? Выбери её внизу.'),400);

function hint(){
  const f=S.f; let h;
  if(!f.v_letter) h='Начни с письма на столе: оно адресовано тебе.';
  else if(!f.gotGear) h = f.v_painting ? 'Выставь на настенных часах время с башни на картине — 7:20. Крути латунные рукоятки по бокам циферблата.' : 'Профессор пишет о времени на любимой картине. Рассмотри картину над столом.';
  else if(!f.gearPlaced) h='В механизме шкатулки не хватает шестерни. Выбери её внизу экрана и коснись пустой оси на передней стенке.';
  else if(!f.topOpen) h='Поверни рукоять на большой шестерне шкатулки.';
  else if(!f.ringsDone){
    if(!f.gotLens) h='Скрытое откроет красный свет. В книжном шкафу нажми книги с римскими цифрами по порядку: I, II, III, IV, V.';
    else if(!f.sawCode) h='Выбери красную линзу внизу и поводи ею по письму — особенно под подписью.';
    else h='Поворачивай кольца касанием, чтобы под красной стрелкой встали знаки из письма. Снаружи внутрь: луна, звезда, треугольник.';
  }
  else if(!f.pipesDone) h='Касайся сегментов, чтобы поворачивать трубы. Пар должен пройти от котла слева до турбины справа.';
  else if(!f.gotHeart) h='Сердце поднялось из шкатулки. Забери его.';
  else h='Выбери Сердце внизу экрана и вставь его в гнездо в центре круглого люка.';
  say(h);
}

  start:()=>{ AU.init(); S=freshState(); S.started=true; S.t0=Date.now(); go('room');
    sayAll(['Осень 1887 года. Профессор Аврелий Брасс, лучший часовщик Нового Лондона, исчез три дня назад.',
      'Ты — его подмастерье. Едва ты вошёл, дверь мастерской захлопнулась, и замок щёлкнул. Изнутри ключа нет.',
      'Единственный другой выход — круглый латунный люк в стене. Но его механизм мёртв.',
      'На столе лежит письмо, адресованное тебе. Касайся предметов, чтобы рассмотреть их.']); },
  cont:()=>{ AU.init(); go(resumeScene && !['title','end'].includes(resumeScene) ? resumeScene : 'room'); },
  knob:el=>{
    if(S.f.clockDone){ say('Часы уже пробили своё. Механизм стрелок застопорился.'); return; }
    const k=el.dataset.k; if(k==='h') S.hs++; else S.ms++;
    AU.click(); AU.tick();
    el.querySelector('.kn').style.transform=`rotate(${(k==='h'?S.hs:S.ms)*40}deg)`;
    setHands(); save();
    if(curH()===7 && curM()===20){
      S.f.clockDone=true; save();
      setTimeout(()=>AU.bell(7),350);
      setTimeout(()=>{ $('#door')?.classList.add('open'); const g=$('#cgear'); if(g) g.removeAttribute('visibility');
        document.querySelectorAll('[data-say="pendulum"]').forEach(n=>n.setAttribute('pointer-events','none')); },900);
      say('Часы бьют семь раз… Дверца маятника со скрипом отворилась!');
    }
  },
  takeGear:()=>{ if(S.f.gotGear||!S.f.clockDone) return; S.f.gotGear=true; $('#cgear')?.remove(); addItem('gear');
    say('Ты взял латунную шестерню. Она тёплая, будто недавно крутилась.'); },
  book:el=>{
    const i=+el.dataset.i, b=BOOKS[i], num=b[4];
    if(S.f.shelfDone){ say(num ? 'Книга утоплена в полку. Механизм шкафа уже сработал.' : b[5]); return; }
    if(!num){ AU.click(); say(b[5]); return; }
    if(num<=S.shelf){ say('Эта книга уже вдавлена.'); return; }
    if(num===S.shelf+1){
      S.shelf++; el.classList.add('in'); AU.click(); AU.tick(); save();
      if(S.shelf===5){ S.f.shelfDone=true; save(); setTimeout(()=>{ AU.whirr(); },200);
        setTimeout(()=>{ render(); AU.chime(); say('Внутри шкафа что-то провернулось, и нижний ящик выехал наружу!'); },900); }
    } else {
      S.shelf=0; save(); AU.clank();
      document.querySelectorAll('.book.in').forEach(n=>n.classList.remove('in'));
      say('Щёлк! Все книги выскочили обратно. Порядок неверный.');
    }
  },
  takeLens:()=>{ if(S.f.gotLens) return; S.f.gotLens=true; addItem('lens'); render(); say('Красная линза в латунной оправе. «Скрытое откроет лишь красный свет»…'); },
  socket:()=>{
    if(S.sel==='gear'){ removeItem('gear'); S.f.gearPlaced=true; save(); AU.click(); AU.clank(); render(); say('Шестерня встала на ось и сцепилась с соседними. Теперь можно крутить рукоять.'); }
    else if(S.inv.includes('gear')) say('Пустая ось. Выбери шестерню внизу экрана, затем коснись оси.');
    else say('Пустая ось. В передаче явно не хватает одной шестерни.');
  },
  crank:()=>{
    const f=S.f, tr=$('#train');
    if(!f.gearPlaced){ AU.clank(); const g=$('#g1'); g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake');
      say('Рукоять заедает: в передаче не хватает звена.'); return; }
    if(f.topOpen){ say('Механизм уже провернулся. Крышка открыта.'); return; }
    tr.classList.add('run'); AU.whirr();
    setTimeout(()=>{ f.topOpen=true; save(); tr.classList.remove('run'); AU.clank(); render(); AU.chime();
      say('Латунная пластина на крышке отъехала. Под ней — три вращающихся кольца со знаками.'); },2000);
  },
  ring:el=>{
    if(S.f.ringsDone) return;
    const i=+el.dataset.i; S.rs[i]++; el.style.transform=`rotate(${-S.rs[i]*60}deg)`; AU.click(); save();
    const ok=RINGS.every((r,k)=>r[S.rs[k]%6]===CODE[k]);
    if(ok){ S.f.ringsDone=true; save();
      setTimeout(()=>{ AU.chime(); $('#medal')?.classList.add('turn'); },450);
      setTimeout(()=>{ go('box'); AU.clank(); say('Кольца встали на место, и крышка шкатулки откинулась! Внутри — паровой контур.'); },2100); }
  },
  pipe:el=>{
    if(S.f.pipesDone) return;
    const i=+el.dataset.i; S.pr[i]++; el.querySelector('.prot').style.transform=`rotate(${S.pr[i]*90}deg)`; AU.click(); save();
    if(updatePipes()){
      S.f.pipesDone=true; save(); AU.hiss();
      setTimeout(()=>{ $('#turb')?.classList.add('on'); const n=$('#pneedle'); if(n) n.style.transform='rotate(100deg)'; AU.whirr(); },300);
      setTimeout(()=>{ AU.chime(); go('box'); say('Пар ударил в турбину, и из глубины шкатулки медленно поднялось сияющее Сердце!'); },2600);
    }
  },
  takeHeart:()=>{ if(S.f.gotHeart) return; S.f.gotHeart=true; addItem('heart'); render(); say('Сердце Хроноса. Оно тёплое и тикает в ладони. «Сердце отворит тебе дверь»…'); },
  hsocket:()=>{
    const f=S.f;
    if(f.heartIn) return;
    if(S.sel==='heart'){
      removeItem('heart'); f.heartIn=true; save(); render(); AU.clank(); AU.chime();
      say('Сердце легло в гнездо и засияло. Люк ожил!');
      setTimeout(()=>{ $('#wheel')?.classList.add('turn'); AU.whirr(); AU.hiss(); },700);
      setTimeout(()=>{ f.doorOpen=true; $('#hdoor')?.classList.add('open'); AU.bell(3); save(); },2900);
      setTimeout(()=>{ S.tEnd=Date.now(); save(); go('end'); },4700);
    } else if(S.inv.includes('heart')) say('Гнездо в форме сердца. Выбери Сердце внизу экрана и коснись гнезда.');
    else say('В центре люка — гнездо в форме сердца. Пустое и холодное.');
  },
  wheel:()=>{ if(S.f.heartIn) return; AU.clank(); const w=$('#wheel'); w.classList.remove('shake'); void w.getBoundingClientRect(); w.classList.add('shake');
    say('Колесо не поддаётся ни на миллиметр. Механизму не хватает сердца.'); }
};
sceneG.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!msgQueue.length && !msgEl.hidden) hideMsg();
  if(t && ACT[t.dataset.act]) ACT[t.dataset.act](t,e);
});
sceneG.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const t=e.target.closest('[data-act]'); if(t){ e.preventDefault(); ACT[t.dataset.act]?.(t,e); } } });

/* ---------------- boot ---------------- */
updSnd();
let resumeScene = S.scene;
S.scene = 'title';
render();
</script>
</body>
</html>
