<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сердце Хроноса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. Top bar, square SVG stage that bleeds to the edges, inventory tray. Single dark look by design. */
:root{
  --soot:#120b07; --char:#1d130c; --brass:#d6a64e; --brass-hi:#f4d68f; --parch:#ead7ac; --ember:#e8752a;
  --line:rgba(214,166,78,.32);
  --display:'Cormorant SC','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Segoe Script','Comic Sans MS',cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--soot);color:var(--parch);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;background:#0b0705}
#top{flex:0 0 auto;display:flex;align-items:center;gap:10px;position:relative;z-index:2;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;
  background:linear-gradient(#2a1b10,#150d08);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.6)}
#loc{flex:1;min-width:0;text-align:center;font:600 21px/1.1 var(--display);letter-spacing:.09em;color:var(--brass-hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000,0 0 14px rgba(244,214,143,.25)}
.btn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid #8a6428;
  background:radial-gradient(circle at 35% 28%,#f6d48a 0%,#b8862f 38%,#5e3b10 100%);color:#2a1606;
  box-shadow:inset 0 1px 1px rgba(255,240,200,.7),inset 0 -2px 3px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.6);
  font:700 22px/1 var(--display);display:grid;place-items:center;cursor:pointer;padding:0}
.btn:focus-visible,.slot:focus-visible,.cta:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn svg{width:22px;height:22px}
.btn.off{filter:saturate(.2) brightness(.7)}
.spacer{width:42px;flex:0 0 auto}
#stage{flex:1 1 auto;position:relative;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 32px),640px);box-sizing:border-box;
  padding:14px 20px 12px;background:linear-gradient(rgba(30,19,11,.94),rgba(16,10,6,.94));border:1px solid rgba(214,166,78,.6);border-radius:3px;
  box-shadow:0 10px 30px rgba(0,0,0,.65),inset 0 0 0 4px rgba(214,166,78,.08);cursor:pointer;animation:msgIn .35s ease}
#msg::before,#msg::after{content:"";position:absolute;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1c4,#b8862f 55%,#4a2e0e)}
#msg::before{left:-5px}#msg::after{right:-5px}
#msg p{margin:0;font:500 19px/1.38 var(--body);color:var(--parch);text-wrap:pretty}
#msg .more{display:block;margin-top:6px;text-align:right;font:500 13px/1 var(--display);letter-spacing:.14em;color:var(--brass)}
@keyframes msgIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#inv{flex:0 0 auto;display:flex;justify-content:center;gap:10px;position:relative;z-index:2;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#1c120a,#0d0805);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.6)}
.slot{width:64px;height:64px;border-radius:50%;border:2px solid #7a5626;padding:6px;box-sizing:border-box;
  background:radial-gradient(circle at 50% 45%,#2a1c11 0%,#0e0805 75%);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 0 0 3px #2a1a0c,0 0 0 4px #8a6428;cursor:pointer;transition:box-shadow .2s,transform .2s}
.slot svg{width:100%;height:100%;display:block}
.slot.sel{box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 0 0 3px #2a1a0c,0 0 0 4px var(--brass-hi),0 0 22px rgba(244,214,143,.6);transform:translateY(-3px)}
.slot.new{animation:newItem 1s ease}
@keyframes newItem{0%{transform:scale(.6)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* SVG animation helpers */
#scene.fade{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 40s linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes swing{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
.swing{animation:swing 2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.9}20%{opacity:.78}45%{opacity:.95}60%{opacity:.82}80%{opacity:1}}
.flick{animation:flick 3.2s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.06,.94)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .9s ease-in-out infinite}
@keyframes rain{from{transform:translate(0,-80px)}to{transform:translate(-26px,380px)}}
.rain{animation:rain .9s linear infinite}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.55}100%{opacity:0;transform:translate(-14px,-80px) scale(2.4)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 3.4s ease-out infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}25%{opacity:.8}100%{transform:translate(30px,-120px);opacity:0}}
.dust{animation:dust 9s linear infinite}
@keyframes bubble{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.bubble{animation:bubble 2.4s ease-in infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(260px)}}
.drift{animation:drift 70s linear infinite}
@keyframes blink{0%,80%,100%{opacity:0}85%,95%{opacity:1}}
.blink{animation:blink 2.2s linear infinite}
@keyframes glint{0%,70%,100%{opacity:0;transform:scale(.2) rotate(0)}82%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{transform-box:fill-box;transform-origin:center;animation:glint 3.6s ease-in-out infinite;pointer-events:none}
@keyframes needle{0%,100%{transform:rotate(-30deg)}40%{transform:rotate(-12deg)}70%{transform:rotate(-24deg)}}
.needle{animation:needle 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.dashpulse{animation:dash 1.2s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .45s ease}
.train.run .gA{animation:spin 1.8s linear infinite}
.train.run .gB{animation:spin 1.8s linear infinite reverse}
.hand{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.kn{transition:transform .3s ease}
.door{transition:transform 1.1s cubic-bezier(.55,0,.2,1)}
.door.open{transform:scaleX(.06)}
.ring{transition:transform .45s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.prot{transition:transform .25s ease}
.tile{cursor:pointer}
.tile .pg{opacity:0;stroke-dasharray:14 18}
.tile.on .pm{stroke:#d27532}
.tile.on .pg{opacity:.9;animation:dash .7s linear infinite}
.book{transition:transform .25s ease;cursor:pointer}
.book .shade{opacity:0;transition:opacity .25s}
.book.in{transform:translateY(6px)}
.book.in .shade{opacity:.5}
.hdoor{transition:transform 1.6s cubic-bezier(.6,0,.2,1),opacity 1.6s}
.hdoor.open{transform:scaleX(.04);opacity:.2}
.wheel.turn{animation:spin 2.2s cubic-bezier(.5,0,.3,1) 1}
.medal.turn{animation:spin 1.4s ease-in-out 1}
.turbine.on{animation:spin 1.2s linear infinite}
.gauge-n{transition:transform 2s cubic-bezier(.3,1.4,.5,1)}
.hot{cursor:pointer}
.cta{cursor:pointer}
.cta:hover .face{filter:brightness(1.12)}
.screen{mix-blend-mode:screen}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(9deg)}35%{transform:rotate(-7deg)}55%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.bellg.ring{animation:ring 1.3s ease-out}
@keyframes seq{0%,100%{opacity:.12}8%,30%{opacity:1}42%{opacity:.12}}
.seq{animation:seq 2.8s ease-in-out infinite}
.shackle{transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.shackle.open{transform:translateY(-70px)}
.crk.go{animation:spin .7s linear 6}
.waves{transition:opacity .4s}
.waves.go{opacity:1}
.note.lit{filter:drop-shadow(0 0 6px #ffb040)}
.note.lit path,.note.lit circle{stroke:#c0141a}
@media (prefers-reduced-motion:reduce){
  .spin,.swing,.rain,.puff,.dust,.glint,.needle,.pulse,.bob,.flick,.flame,.dashpulse,.bubble,.twinkle,.drift,.blink{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="btn" id="back" aria-label="Назад" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="spacer" id="backSpacer"></span>
    <div id="loc">Сердце Хроноса</div>
    <button class="btn" id="snd" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="btn" id="hint" aria-label="Подсказка" hidden>?</button>

  <main id="stage">
    <svg id="view" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

        <linearGradient id="brassH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d896"/><stop offset=".45" stop-color="#b8862f"/><stop offset="1" stop-color="#5e3b10"/></linearGradient>
        <linearGradient id="brassV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5e3b10"/><stop offset=".35" stop-color="#e6bd68"/><stop offset=".55" stop-color="#fbe2a6"/><stop offset="1" stop-color="#6a4314"/></linearGradient>
        <radialGradient id="brassR" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff0c2"/><stop offset=".22" stop-color="#e4b65c"/><stop offset=".65" stop-color="#9b6a28"/><stop offset="1" stop-color="#4a2e0e"/></radialGradient>
        <radialGradient id="brassD" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#c49a58"/><stop offset=".5" stop-color="#7a5428"/><stop offset="1" stop-color="#32200c"/></radialGradient>
        <radialGradient id="rivet" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff3cf"/><stop offset=".4" stop-color="#c99a4a"/><stop offset="1" stop-color="#3e260c"/></radialGradient>
        <linearGradient id="copperH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2810"/><stop offset=".18" stop-color="#f4b88c"/><stop offset=".4" stop-color="#c06a34"/><stop offset=".75" stop-color="#6e3416"/><stop offset="1" stop-color="#2e1406"/></linearGradient>
        <linearGradient id="copperV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2e1406"/><stop offset=".25" stop-color="#c06a34"/><stop offset=".45" stop-color="#f4b88c"/><stop offset=".7" stop-color="#8a4420"/><stop offset="1" stop-color="#2e1406"/></linearGradient>

        <!-- woods, fabrics, papers (base colours; textures overlay these) -->
        <linearGradient id="woodV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f2e18"/><stop offset="1" stop-color="#2a170b"/></linearGradient>
        <linearGradient id="mahog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a321a"/><stop offset=".5" stop-color="#55200f"/><stop offset="1" stop-color="#2e1108"/></linearGradient>
        <radialGradient id="ivory" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#efe0bd"/><stop offset="1" stop-color="#c9ad78"/></radialGradient>
        <radialGradient id="parchEdge" r=".72"><stop offset=".6" stop-color="#5a2e0c" stop-opacity="0"/><stop offset=".92" stop-color="#5a2e0c" stop-opacity=".45"/><stop offset="1" stop-color="#2a1404" stop-opacity=".8"/></radialGradient>

        <linearGradient id="folds" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="26" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#2e060c"/><stop offset=".35" stop-color="#7a1824"/><stop offset=".55" stop-color="#9a2632"/><stop offset=".75" stop-color="#5a0e18"/><stop offset="1" stop-color="#2e060c"/></linearGradient>
        <linearGradient id="greenGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab88a"/><stop offset=".25" stop-color="#1f6a46"/><stop offset=".7" stop-color="#0c3a24"/><stop offset="1" stop-color="#062014"/></linearGradient>
        <!-- shading overlays -->
        <linearGradient id="shV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>

        <linearGradient id="shWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".25" stop-color="#000" stop-opacity=".1"/><stop offset=".8" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
        <linearGradient id="shFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset=".45" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
        <linearGradient id="shCyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".28" stop-color="#fff" stop-opacity=".14"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></linearGradient>
        <radialGradient id="shAO" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="moonBeam" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#b8ceff" stop-opacity=".28"/><stop offset="1" stop-color="#b8ceff" stop-opacity="0"/></linearGradient>
        <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0a0" stop-opacity=".45"/><stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/></linearGradient>
        <!-- lights & scenes -->

        <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a4a3a"/><stop offset="1" stop-color="#1e1028"/></linearGradient>
        <radialGradient id="varnish" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#fff2c8" stop-opacity=".1"/><stop offset="1" stop-color="#3a1a00" stop-opacity=".55"/></radialGradient>
        <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".35" stop-color="#fff" stop-opacity=".02"/><stop offset=".55" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="ringG0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efca7c"/><stop offset=".5" stop-color="#a87634"/><stop offset="1" stop-color="#e1b45e"/></linearGradient>
        <linearGradient id="ringG1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf9d50"/><stop offset=".5" stop-color="#7a4f1e"/><stop offset="1" stop-color="#c08a3e"/></linearGradient>
        <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c8"/><stop offset=".5" stop-color="#e2b257"/><stop offset="1" stop-color="#8a5a1a"/></linearGradient>
        <radialGradient id="heartG" cx=".42" cy=".38" r=".72"><stop offset="0" stop-color="#fff4c4"/><stop offset=".25" stop-color="#ffb070"/><stop offset=".62" stop-color="#e3401c"/><stop offset="1" stop-color="#5e0a05"/></radialGradient>

        <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c080"/><stop offset=".35" stop-color="#b0743a"/><stop offset=".7" stop-color="#6a3a14"/><stop offset="1" stop-color="#2e1606"/></linearGradient>
        <radialGradient id="moonGlass" cx=".42" cy=".38" r=".72"><stop offset="0" stop-color="#e2ebf8"/><stop offset=".45" stop-color="#8ea6c4"/><stop offset="1" stop-color="#26344a"/></radialGradient>
        <linearGradient id="shCylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".28" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></linearGradient>
        <radialGradient id="hornIn" cx=".6" cy=".62" r=".62"><stop offset="0" stop-color="#1a0e04"/><stop offset=".3" stop-color="#5a3812"/><stop offset=".75" stop-color="#c9964a"/><stop offset="1" stop-color="#f4d692"/></radialGradient>
        <radialGradient id="recess" r=".5"><stop offset=".7" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
        <!-- procedural textures (filled in by script at start) -->
        <pattern id="pWood" width="512" height="256" patternUnits="userSpaceOnUse" patternTransform="scale(.7)"><image data-tx="wood" width="512" height="256" preserveAspectRatio="none"/></pattern>
        <pattern id="pWoodV" width="512" height="256" patternUnits="userSpaceOnUse" patternTransform="rotate(90) scale(.7)"><image data-tx="wood" width="512" height="256" preserveAspectRatio="none"/></pattern>
        <pattern id="pFloor" width="512" height="256" patternUnits="userSpaceOnUse" patternTransform="rotate(90) scale(1.2 .9)"><image data-tx="wood" width="512" height="256" preserveAspectRatio="none"/></pattern>

/* ---------------- audio (synthesised) ---------------- */

  tone(f,d,type='sine',v=.12,dl=0,f2){

/* ---------------- procedural textures ---------------- */
function rng(seed){ let s=seed; return ()=> (s = (s*16807) % 2147483647) / 2147483647; }
function makeNoise(seed){
  const r=rng(seed*7919+13), p=new Uint8Array(256), v=new Float32Array(256);
  for(let i=0;i<256;i++){ p[i]=i; v[i]=r(); }
  for(let i=255;i>0;i--){ const j=Math.floor(r()*(i+1)), t=p[i]; p[i]=p[j]; p[j]=t; }
  const h=(x,y)=>v[p[(p[x&255]+y)&255]];
  return (x,y,Px,Py)=>{
    const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy, u=fx*fx*(3-2*fx), w=fy*fy*(3-2*fy);
    const x0=((ix%Px)+Px)%Px, y0=((iy%Py)+Py)%Py, x1=(x0+1)%Px, y1=(y0+1)%Py;
    const a=h(x0,y0), b=h(x1,y0), c=h(x0,y1), d=h(x1,y1);
    return a+(b-a)*u+(c-a)*w+(a-b-c+d)*u*w;
  };
}
// tileable fractal noise: u,v in [0,1), fx/fy base periods
function fbm(n,u,v,fx,fy,oct){
  let s=0, a=.5, t=0;
  for(let k=0;k<oct;k++){ const m=1<<k; s+=n(u*fx*m, v*fy*m, fx*m, fy*m)*a; t+=a; a*=.5; }
  return s/t;
}
const sm=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
const mix=(a,b,t)=>a+(b-a)*t;
function canvasTex(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'), im=g.createImageData(w,h), d=im.data, o=[0,0,0,255];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ o[3]=255; fn(x/w,y/h,o,x,y); const i=(y*w+x)*4; d[i]=o[0]; d[i+1]=o[1]; d[i+2]=o[2]; d[i+3]=o[3]; }
  g.putImageData(im,0,0); return c;
}
function woodTex(seed,dark,light){
  const n=makeNoise(seed);
  return canvasTex(512,256,(u,v,o)=>{
    const warp=fbm(n,u,v,3,2,3), fib=fbm(n,u,v,6,64,3);
    const ring=.5+.5*Math.sin(Math.PI*2*(v*5+warp*1.8));
    let k=Math.pow(ring,2.5)*.55+fib*.5;
    if(fib>.72) k*=.75;
    for(let i=0;i<3;i++) o[i]=mix(dark[i],light[i],Math.max(0,Math.min(1,k)));
  });
}
function paperTex(){ // dark green wallpaper with gold damask, half-drop repeat
  const n=makeNoise(5);
  const c=canvasTex(256,320,(u,v,o,x)=>{
    const m=fbm(n,u,v,4,5,4);
    o[0]=mix(18,34,m); o[1]=mix(30,48,m); o[2]=mix(24,38,m);
    if(x%64<2){ o[0]+=22; o[1]+=17; o[2]+=6; }
  });
  const g=c.getContext('2d');
  const motif=new Path2D('M128,40 C150,70 172,92 160,132 C186,120 208,142 202,172 C192,204 160,208 146,192 C152,218 146,242 128,272 C110,242 104,218 110,192 C96,208 64,204 54,172 C48,142 70,120 96,132 C84,92 106,70 128,40 Z');
  const inner=new Path2D('M128,92 C140,118 140,150 128,176 C116,150 116,118 128,92 Z M128,196 m-11,0 a11,11 0 1 0 22,0 a11,11 0 1 0 -22,0');
  for(const [dx,dy] of [[0,0],[-128,-160],[128,-160],[-128,160],[128,160]]){
    g.save(); g.translate(dx,dy);
    g.fillStyle='rgba(201,160,98,.17)'; g.fill(motif);
    g.strokeStyle='rgba(240,200,130,.22)'; g.lineWidth=1.5; g.stroke(motif);
    g.fillStyle='rgba(10,20,14,.55)'; g.fill(inner);
    g.strokeStyle='rgba(201,160,98,.2)'; g.stroke(inner);
    g.restore();
  }
  return c;
}
function leatherTex(){
  const n=makeNoise(9);
  return canvasTex(256,256,(u,v,o)=>{
    const g=fbm(n,u,v,32,32,2), m=fbm(n,u,v,3,3,3);
    const pebble=Math.pow(Math.abs(g-.5)*2,.6);
    const k=.62+.38*m-pebble*.22;
    o[0]=24*k+6; o[1]=58*k+6; o[2]=40*k+4;
  });
}
function parchTex(){
  const n=makeNoise(21);
  return canvasTex(384,384,(u,v,o)=>{
    const m=fbm(n,u,v,3,3,5), fib=fbm(n,u,v,48,6,2), spot=fbm(n,u,v,12,12,2);
    const t=sm(.38,.85,m)*.8 + (spot>.74?.25:0);
    const k=.93+.1*fib;
    o[0]=mix(242,196,t)*k; o[1]=mix(226,158,t)*k; o[2]=mix(186,100,t)*k;
  });
}
function spunTex(){ // circular brushed metal, alpha-only highlights
  const n=makeNoise(3);
  return canvasTex(384,384,(u,v,o)=>{
    const x=u*2-1, y=v*2-1, r=Math.hypot(x,y), th=Math.atan2(y,x);
    if(r>1){ o[3]=0; return; }
    const ring=n(r*140,1.5,256,256), fine=n(u*256,v*256,256,256);
    const b=.5+.32*Math.cos(2*(th+Math.PI/4))*(.4+.6*r)+(ring-.5)*.4+(fine-.5)*.08;
    if(b>.5){ o[0]=o[1]=o[2]=255; o[3]=Math.min(255,(b-.5)*2*210); }
    else { o[0]=o[1]=o[2]=0; o[3]=Math.min(255,(.5-b)*2*190); }
  });
}
function brushTex(){
  const n=makeNoise(4);
  return canvasTex(256,256,(u,v,o)=>{
    const b=.5+(fbm(n,u,v,2,128,2)-.5)*1.3;
    if(b>.5){ o[0]=o[1]=o[2]=255; o[3]=(b-.5)*2*150; } else { o[0]=o[1]=o[2]=0; o[3]=(.5-b)*2*150; }
  });
}
function grimeTex(){
  const n=makeNoise(17);
  return canvasTex(384,384,(u,v,o)=>{
    const g=fbm(n,u,v,4,4,5), sp=n(u*192,v*192,192,192);
    o[0]=14; o[1]=9; o[2]=4; o[3]=sm(.46,.8,g)*170 + (sp>.94?110:0);
  });
}
function patinaTex(){
  const n=makeNoise(29);
  return canvasTex(256,256,(u,v,o)=>{
    const g=fbm(n,u,v,6,6,4);
    o[0]=70; o[1]=140; o[2]=112; o[3]=sm(.56,.8,g)*200;
  });
}
function stoneTex(){
  const n=makeNoise(41), hs=(a,b)=>{ const x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); };
  return canvasTex(256,240,(u,v,o,x,y)=>{
    const row=Math.floor(y/40), off=(row%2)*64, bx=(x+off)%128, by=y%40, idx=Math.floor(((x+off)%256)/128);
    const m=fbm(n,u,v,8,8,4);
    if(bx<4||by<4){ const k=.55+.4*m; o[0]=40*k; o[1]=35*k; o[2]=30*k; return; }
    const h=hs(row,idx), k=(.72+.34*h)*(.72+.5*m);
    const e=Math.min(bx-4,127-bx,by-4,39-by), ed=e<6?.72+.046*e:1;
    o[0]=(98+22*h)*k*ed; o[1]=(86+12*h)*k*ed; o[2]=(74+6*h)*k*ed;
  });
}
let TEX_READY=false;
async function buildTextures(progress){
  const jobs=[
    ['wood',()=>woodTex(1,[34,18,9],[118,70,36]),'jpeg'],
    ['mahog',()=>woodTex(2,[52,14,6],[152,58,28]),'jpeg'],
    ['paper',paperTex,'jpeg'],
    ['leather',leatherTex,'jpeg'],
    ['parch',parchTex,'jpeg'],
    ['spun',spunTex,'png'],
    ['brush',brushTex,'png'],
    ['grime',grimeTex,'png'],
    ['patina',patinaTex,'png'],
    ['stone',stoneTex,'jpeg']
  ];
  for(let i=0;i<jobs.length;i++){
    await new Promise(r=>setTimeout(r,0));
    const [id,fn,fmt]=jobs[i];
    try{
      const url=fn().toDataURL(fmt==='jpeg'?'image/jpeg':'image/png', .9);
      document.querySelectorAll(`image[data-tx="${id}"]`).forEach(im=>{ im.setAttribute('href',url); im.setAttributeNS('http://www.w3.org/1999/xlink','href',url); });
    }catch(e){}
    progress((i+1)/jobs.length);
  }

}

/* ---------------- drawing helpers ---------------- */
const BEV=' filter="url(#bevel)"', BEVS=' filter="url(#bevelS)"', BEVL=' filter="url(#bevelL)"', CARVE=' filter="url(#carve)"';
function gearPath(cx,cy,ro,ri,n){
  let d=''; const st=Math.PI*2/n;
  for(let i=0;i<n;i++){ const a=i*st-Math.PI/2;
    [[a,ri],[a+st*.16,ro],[a+st*.46,ro],[a+st*.62,ri]].forEach(([an,r],j)=>{
      d+=(i===0&&j===0?'M':'L')+f1(cx+Math.cos(an)*r)+','+f1(cy+Math.sin(an)*r); });
  }
  return d+'Z';
}
const circlePath=(cx,cy,r)=>`M${f1(cx-r)},${f1(cy)} a${f1(r)},${f1(r)} 0 1 0 ${f1(2*r)},0 a${f1(r)},${f1(r)} 0 1 0 ${f1(-2*r)},0 Z`;
function gear(cx,cy,r,n,o={}){
  const ri=r*.84, cls=[o.cls||'', o.spin?'spin':'', o.rev?'rev':''].join(' ').trim();
  const st=`transform-origin:${cx}px ${cy}px;${o.spin?`animation-duration:${o.spin}s;`:''}`;
  let holes='';
  if(r>24 && !o.solid){ const k=o.holes||5; for(let i=0;i<k;i++){ const a=i*Math.PI*2/k+.3; holes+=circlePath(cx+Math.cos(a)*r*.5, cy+Math.sin(a)*r*.5, r*.16); } }
  const d=gearPath(cx,cy,r,ri,n)+holes;
  const inner=`<g class="${cls}" style="${st}"${o.id?` id="${o.id}"`:''}>
    <path d="${d}" fill-rule="evenodd" fill="${o.fill||'url(#brass)'}" stroke="#2e1c08" stroke-width="${o.sw||1.5}"/>
    <path d="${d}" fill-rule="evenodd" fill="url(#pSpun)" opacity="${o.spun??.45}"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(ri*.8)}" fill="none" stroke="#3a240a" stroke-width="${f1(Math.max(1.2,r*.04))}" opacity=".5"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.22)}" fill="url(#brassR)" stroke="#2e1c08" stroke-width="1.2"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.08)}" fill="${o.jewel?'#c0142a':'#1a0f06'}"/>${o.extra||''}
  </g>`;
  return `<g${o.bev?(r>40?BEV:BEVS):''}${o.op?` opacity="${o.op}"`:''}>${inner}</g>`;
}
const rivet = (x,y,r=6) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="url(#rivet)" stroke="#2a1806" stroke-width="1"/>`;
function rivetRing(cx,cy,R,n,r=6,off=0){ let s=''; for(let i=0;i<n;i++){ const a=i*Math.PI*2/n+off; s+=rivet(cx+Math.cos(a)*R, cy+Math.sin(a)*R, r); } return s; }
function bolt(x,y,r){ let p=''; for(let i=0;i<6;i++){ const a=rad(i*60+30); p+=`${f1(x+Math.cos(a)*r)},${f1(y+Math.sin(a)*r)} `; }
  return `<polygon points="${p}" fill="url(#brassR)" stroke="#2a1806" stroke-width="1"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r*.45)}" fill="url(#brass)" stroke="#2a1806" stroke-width=".8"/>`; }
function boltRing(cx,cy,R,n,r){ let s=''; for(let i=0;i<n;i++){ const a=i*Math.PI*2/n; s+=bolt(cx+Math.cos(a)*R, cy+Math.sin(a)*R, r); } return s; }
function disc(cx,cy,r,fill='url(#brassR)',spun=.55){ return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="url(#pSpun)" opacity="${spun}"/>`; }
function annulus(cx,cy,ro,ri,fill='url(#brass)',spun=.5){ const d=circlePath(cx,cy,ro)+circlePath(cx,cy,ri);
  return `<path d="${d}" fill-rule="evenodd" fill="${fill}"/><path d="${d}" fill-rule="evenodd" fill="url(#pSpun)" opacity="${spun}"/>`; }
function knurl(cx,cy,r,n,len,col='#2e1c08',w=1.4){ let s=''; for(let i=0;i<n;i++){ const a=i*Math.PI*2/n;
  s+=`M${f1(cx+Math.cos(a)*(r-len/2))},${f1(cy+Math.sin(a)*(r-len/2))}L${f1(cx+Math.cos(a)*(r+len/2))},${f1(cy+Math.sin(a)*(r+len/2))}`; }
  return `<path d="${s}" stroke="${col}" stroke-width="${w}" opacity=".7"/>`; }
function tex(tag,geom,base,pat,shade){ return `<${tag} ${geom} fill="${base}"/>`+(pat?`<${tag} ${geom} fill="url(#${pat})"/>`:'')+(shade?`<${tag} ${geom} fill="${shade}"/>`:''); }
const R4=(x,y,w,h,rx=0)=>`x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}"${rx?` rx="${rx}"`:''}`;
function woodRect(x,y,w,h,pat='pWood',shade='url(#shV)',base='#3a2010',rx=0){ return tex('rect',R4(x,y,w,h,rx),base,pat,shade); }
function molding(x,y,w,h,pat='pWood'){ return `<g${CARVE}>${woodRect(x,y,w,h,pat,'url(#shVr)')}</g><rect ${R4(x,y+h-2,w,2)} fill="#000" opacity=".5"/><rect ${R4(x,y,w,1.5)} fill="#f0c890" opacity=".3"/>`; }
function carvedPanel(x,y,w,h,pat='pWoodV'){
  return `<rect ${R4(x,y,w,h)} fill="#000" opacity=".45"/>
  <g${CARVE}>${woodRect(x+5,y+5,w-10,h-10,pat,'url(#shVr)','#4a2a14',2)}</g>
  <rect ${R4(x+16,y+16,w-32,h-32)} fill="none" stroke="#000" stroke-opacity=".4" stroke-width="2"/>
  <rect ${R4(x+17.5,y+17.5,w-32,h-32)} fill="none" stroke="#f0c090" stroke-opacity=".16" stroke-width="1.2"/>`;
}
function brassBar(x,y,w,h,o=''){ return `<g${BEVS}><rect ${R4(x,y,w,h,Math.min(3,h/2))} fill="url(#brassH)"${o}/><rect ${R4(x,y,w,h,Math.min(3,h/2))} fill="url(#pBrush)" opacity=".5"/></g>`; }
function filigree(x,y,s,rot){
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${rot}) scale(${s})"${BEVS}>
    <path d="M0,0 C14,-4 26,-16 22,-28 C18,-38 6,-36 6,-28 C6,-22 14,-22 14,-27 M0,0 C4,14 16,26 28,22 C38,18 36,6 28,6 C22,6 22,14 27,14" fill="none" stroke="url(#brassH)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M6,6 C18,0 32,6 38,18 C26,22 14,20 6,6 Z" fill="url(#brass)"/>
    <circle r="5" fill="url(#brassR)"/></g>`;
}
function heartPath(cx,cy,s){
  return `M${f1(cx)},${f1(cy+s*.92)} C${f1(cx-s*1.45)},${f1(cy+s*.08)} ${f1(cx-s*.95)},${f1(cy-s*.95)} ${f1(cx)},${f1(cy-s*.36)} C${f1(cx+s*.95)},${f1(cy-s*.95)} ${f1(cx+s*1.45)},${f1(cy+s*.08)} ${f1(cx)},${f1(cy+s*.92)} Z`;
}
function heartObj(cx,cy,s,glow=true){
  return `<g>
    ${glow?`<circle cx="${cx}" cy="${cy}" r="${f1(s*2.3)}" fill="url(#warm)" class="pulse"/>`:''}
    <path d="${heartPath(cx,cy,s)}" fill="url(#heartG)" stroke="#4a0a03" stroke-width="${f1(s*.05)}"${glow?' filter="url(#glow)"':''}/>
    <path d="M${cx},${f1(cy-s*.36)} L${f1(cx-s*.35)},${f1(cy+s*.1)} L${cx},${f1(cy+s*.9)} M${cx},${f1(cy-s*.36)} L${f1(cx+s*.4)},${f1(cy+s*.05)} L${cx},${f1(cy+s*.9)} M${f1(cx-s*.35)},${f1(cy+s*.1)} L${f1(cx+s*.4)},${f1(cy+s*.05)}" stroke="#fff2c8" stroke-width="${f1(s*.025)}" fill="none" opacity=".45"/>
    <g${s>30?BEVS:''}><path d="${heartPath(cx,cy,s*1.1)}" fill="none" stroke="url(#brass)" stroke-width="${f1(s*.08)}"/>
    <ellipse cx="${cx}" cy="${f1(cy+s*.05)}" rx="${f1(s*1.02)}" ry="${f1(s*.22)}" fill="none" stroke="url(#brass)" stroke-width="${f1(s*.055)}"/></g>
    ${gear(cx, cy-s*.6, s*.24, 8, {solid:true})}
  </g>`;
}
function glyph(n,x,y,s,col,sw=5){
  const h=s/2, g=`<g transform="translate(${f1(x)},${f1(y)})" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">`;
  switch(n){
    case 'sun': return g+`<circle r="${f1(h*.62)}"/><circle r="${f1(h*.13)}" fill="${col}"/></g>`;
    case 'moon': return g+`<path d="M${f1(h*.15)},${f1(-h*.7)} A${f1(h*.7)},${f1(h*.7)} 0 1 0 ${f1(h*.15)},${f1(h*.7)} A${f1(h*.55)},${f1(h*.75)} 0 0 1 ${f1(h*.15)},${f1(-h*.7)} Z" fill="${col}" stroke="none"/></g>`;
    case 'star': return g+`<path d="M0,${f1(-h*.78)} L${f1(h*.67)},${f1(h*.39)} L${f1(-h*.67)},${f1(h*.39)} Z M0,${f1(h*.78)} L${f1(h*.67)},${f1(-h*.39)} L${f1(-h*.67)},${f1(-h*.39)} Z"/></g>`;
    case 'tri': return g+`<path d="M0,${f1(-h*.72)} L${f1(h*.68)},${f1(h*.5)} L${f1(-h*.68)},${f1(h*.5)} Z"/><circle cy="${f1(h*.12)}" r="${f1(h*.1)}" fill="${col}"/></g>`;
    case 'wave': return g+`<path d="M${f1(-h*.7)},${f1(-h*.18)} q${f1(h*.175)},${f1(-h*.32)} ${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0 M${f1(-h*.7)},${f1(h*.26)} q${f1(h*.175)},${f1(-h*.32)} ${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0 t${f1(h*.35)},0"/></g>`;
    case 'earth': return g+`<circle r="${f1(h*.62)}"/><path d="M0,${f1(-h*.62)} V${f1(h*.62)} M${f1(-h*.62)},0 H${f1(h*.62)}"/></g>`;
  }
  return '';
}
const engraved = (n,x,y,s) => glyph(n,x+1.6,y+1.6,s,'#f8dc9c',5).replace('<g ','<g opacity=".45" ') + glyph(n,x,y,s,'#2a1608',5);
const glint = (x,y,key) => S.f['v_'+key] ? '' :
  `<path class="glint" style="animation-delay:${(x%7)/3}s" d="M${x},${y-16} L${x+3.5},${y-3.5} L${x+16},${y} L${x+3.5},${y+3.5} L${x},${y+16} L${x-3.5},${y+3.5} L${x-16},${y} L${x-3.5},${y-3.5} Z" fill="#fff6d6"/>`;
const hot = (x,y,w,h,act,extra='') => `<rect class="hot" x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent" data-act="${act}" ${extra}/>`;
const vignette = () => `<rect x="-500" y="-500" width="2000" height="2000" fill="url(#vig)" pointer-events="none"/>`;
const bleed = ([top,bot,y,tp,bp]) => `<rect x="-1500" y="-1500" width="4000" height="${y+1500}" fill="${top}"/>${tp?`<rect x="-1500" y="-1500" width="4000" height="${y+1500}" fill="url(#${tp})"/>`:''}<rect x="-1500" y="${y}" width="4000" height="3000" fill="${bot}"/>${bp?`<rect x="-1500" y="${y}" width="4000" height="3000" fill="url(#${bp})"/>`:''}`;
function handDeg(){ return [S.hs*30 + S.ms*2.5, S.ms*30]; }
const curH = () => ((S.hs % 12) + 12) % 12, curM = () => (S.ms % 12) * 5;

function gauge(cx,cy,r,deg,o={}){
  let ticks='';
  for(let i=0;i<11;i++){ const a=rad(-125+i*25); ticks+=`<line x1="${f1(cx+Math.sin(a)*r*.56)}" y1="${f1(cy-Math.cos(a)*r*.56)}" x2="${f1(cx+Math.sin(a)*r*.7)}" y2="${f1(cy-Math.cos(a)*r*.7)}" stroke="#2a1a0c" stroke-width="${i%5?r*.025:r*.05}"/>`; }
  const a1=rad(50), a2=rad(125), rr=r*.63;
  const arc=`M${f1(cx+Math.sin(a1)*rr)},${f1(cy-Math.cos(a1)*rr)} A${f1(rr)},${f1(rr)} 0 0 1 ${f1(cx+Math.sin(a2)*rr)},${f1(cy-Math.cos(a2)*rr)}`;
  return `<g${o.shadow===false?'':' filter="url(#shS)"'}><g${r>30?BEV:BEVS}>${disc(cx,cy,r,'url(#brass)')}</g></g>
    ${knurl(cx,cy,r*.93,Math.round(r*1.6),r*.08)}
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.84)}" fill="#1e1006"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.79)}" fill="url(#ivory)"/>
    <circle cx="${cx}" cy="${cy}" r="${f1(r*.79)}" fill="url(#pParchS)" opacity=".35"/>
    <path d="${arc}" fill="none" stroke="#a8241a" stroke-width="${f1(r*.08)}"/>${ticks}
    ${o.label?`<text x="${cx}" y="${f1(cy+r*.42)}" text-anchor="middle" font-family="Cormorant SC,serif" font-weight="700" font-size="${f1(r*.2)}" fill="#5a3a14">${o.label}</text>`:''}
    <g${o.id?` id="${o.id}"`:''} class="${o.anim?'needle':o.cls||''}" style="transform-origin:${cx}px ${cy}px;${o.anim?'':`transform:rotate(${deg}deg)`}">
      <path d="M${f1(cx-r*.05)},${f1(cy+r*.16)} L${cx},${f1(cy-r*.7)} L${f1(cx+r*.05)},${f1(cy+r*.16)} Z" fill="#7a1408"/></g>
    ${disc(cx,cy,r*.12,'url(#brassR)',.4)}
    <ellipse cx="${f1(cx-r*.22)}" cy="${f1(cy-r*.32)}" rx="${f1(r*.42)}" ry="${f1(r*.2)}" transform="rotate(-32 ${f1(cx-r*.22)} ${f1(cy-r*.32)})" fill="#fff" opacity=".22"/>`;
}
function bulb(x,y,s){
  return `<circle cx="${x}" cy="${y}" r="${f1(s*4)}" fill="url(#warm)" class="flick screen"/>
  <path d="M${f1(x-s*.42)},${f1(y-s*1.0)} C${f1(x-s*1.15)},${f1(y-s*.4)} ${f1(x-s*1.05)},${f1(y+s*.95)} ${x},${f1(y+s*1.15)} C${f1(x+s*1.05)},${f1(y+s*.95)} ${f1(x+s*1.15)},${f1(y-s*.4)} ${f1(x+s*.42)},${f1(y-s*1.0)} Z" fill="#ffcf80" opacity=".28" stroke="#fff4d0" stroke-opacity=".5" stroke-width="1.2"/>
  <path d="M${f1(x-s*.2)},${f1(y-s*.9)} L${f1(x-s*.2)},${f1(y-s*.1)} l${f1(s*.1)},${f1(s*.15)} l${f1(s*.1)},${f1(-s*.15)} l${f1(s*.1)},${f1(s*.15)} l${f1(s*.1)},${f1(-s*.15)} L${f1(x+s*.2)},${f1(y-s*.9)}" fill="none" stroke="#ffd27a" stroke-width="${f1(s*.07)}" filter="url(#glow)"/>
  <path d="M${f1(x-s*.6)},${f1(y-s*.3)} C${f1(x-s*.7)},${f1(y+s*.2)} ${f1(x-s*.5)},${f1(y+s*.6)} ${f1(x-s*.25)},${f1(y+s*.8)}" fill="none" stroke="#fff" stroke-width="${f1(s*.08)}" opacity=".45" stroke-linecap="round"/>

}
function orrery(cx,cy,s){

}

function placeLens(){
  const [x,y]=S.lens, l=$('#lens'), c=$('#lensC');
  if(l) l.setAttribute('transform',`translate(${x},${y})`);
  if(c){ c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',100); }
  if(Math.hypot(x-420,y-860)<95 && !S.f.sawCode){ S.f.sawCode=true; save(); AU.chime(); say('Под красным стеклом проступили знаки, написанные невидимыми чернилами!'); }
}
function toSvg(e){ const p=svgEl.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svgEl.getScreenCTM().inverse()); }
function mountLetter(){
  const c=$('#lensC'); if(c) c.setAttribute('cx',-500);
  if(S.sel!=='lens') return;
  placeLens();
  let drag=false;
  const move=e=>{ const p=toSvg(e); S.lens=[Math.max(90,Math.min(910,p.x-60)), Math.max(90,Math.min(930,p.y-60))]; placeLens(); };
  svgEl.onpointerdown=e=>{ if(S.scene!=='letter'||S.sel!=='lens') return; drag=true; try{svgEl.setPointerCapture(e.pointerId);}catch(_){} move(e); };
  svgEl.onpointermove=e=>{ if(drag) move(e); };
  svgEl.onpointerup=svgEl.onpointercancel=()=>{ if(drag){ drag=false; save(); } };
}

function pipeFlow(){

    conns(PIPE_SOL[i][0],rot(i)).forEach(d=>{ const nr=r+[-1,0,1,0][d], nc=c+[0,1,0,-1][d]; if(nr<0||nr>3||nc<0||nc>3) return;
      const j=nr*4+nc; if(!on.has(j) && has(j,(d+2)%4)){ on.add(j); q.push(j); } }); }
  return { on, win: on.has(11) && has(11,1) };
}
function updatePipes(){
  const {on,win}=pipeFlow();
  PIPE_SOL.forEach((_,i)=>{ const el=$('#tile'+i); if(el) el.classList.toggle('on',on.has(i)); });

}

}

/* ---------------- UI ---------------- */
let msgQueue=[];
function showMsg(t){ msgEl.hidden=false; msgText.textContent=t; msgMore.hidden=!msgQueue.length; msgEl.style.animation='none'; void msgEl.offsetWidth; msgEl.style.animation=''; }
function say(t){ msgQueue=[]; showMsg(t); }
function sayAll(a){ msgQueue=a.slice(1); showMsg(a[0]); }
function hideMsg(){ msgEl.hidden=true; }
msgEl.addEventListener('click',()=>{ if(msgQueue.length) showMsg(msgQueue.shift()); else hideMsg(); });

function renderInv(){
  const inv=$('#inv'); const showInv = !['title','end','end2'].includes(S.scene);
  inv.hidden=!showInv; if(!showInv) return;
  let h=''; for(let i=0;i<4;i++){ const id=S.inv[i];
    h+=`<button class="slot${id&&S.sel===id?' sel':''}" data-slot="${i}" aria-label="${id?ITEMS[id].name:'Пустой слот'}">${id?`<svg viewBox="0 0 100 100">${ITEMS[id].icon()}</svg>`:''}</button>`; }
  inv.innerHTML=h;
}
$('#inv').addEventListener('click',e=>{
  const b=e.target.closest('.slot'); if(!b) return; const id=S.inv[+b.dataset.slot]; if(!id) return;
  AU.click(); S.sel = S.sel===id ? null : id; save();
  if(S.scene==='letter') render(); else renderInv();
  if(S.sel) say(ITEMS[id].desc); else hideMsg();
});
function addItem(id){
  S.inv.push(id); S.sel=null; save(); renderInv(); AU.pick();
  const b=document.querySelector(`.slot[data-slot="${S.inv.length-1}"]`); if(b) b.classList.add('new');
}
function removeItem(id){ S.inv=S.inv.filter(x=>x!==id); if(S.sel===id) S.sel=null; renderInv(); }

function render(){
  const sc=SC[S.scene]||SC.room;
  svgEl.onpointerdown=svgEl.onpointermove=svgEl.onpointerup=svgEl.onpointercancel=null;
  sceneG.innerHTML=(sc.bleed?bleed(sc.bleed):'')+sc.draw();
  sceneG.classList.remove('fade'); void sceneG.getBoundingClientRect(); sceneG.classList.add('fade');
  if(sc.mount) sc.mount();
  $('#loc').textContent=sc.title;
  $('#back').hidden=!sc.back; $('#backSpacer').hidden=!!sc.back;
  $('#hint').hidden=!sc.hint;
  renderInv();
}
function go(n){
  if(!SC[n]) n='room';
  if(S.scene!==n) hideMsg();
  S.scene=n; if(SC[n].hint) S.f['v_'+n]=true; if(n==='dial' && S.f.gearsDone && !S.f.sawDial){ S.f.sawDial=true; setTimeout(()=>say('Четыре стекла вспыхивают красным по очереди. Рядом с каждым — от одной до четырёх точек.'),400); }
  render(); save();
  if(n==='letter' && S.inv.includes('lens') && S.sel!=='lens' && S.f.gotLens && !S.f.sawCode) setTimeout(()=>say('Может, взглянуть на письмо через красную линзу? Выбери её внизу.'),400);
}
$('#back').addEventListener('click',()=>{ AU.click(); go(SC[S.scene].back||'room'); });
$('#hint').addEventListener('click',()=>{ AU.click(); hint(); });
function updSnd(){ $('#snd').classList.toggle('off',!soundOn); $('#sndWave').style.display=soundOn?'':'none'; }
$('#snd').addEventListener('click',()=>{ soundOn=!soundOn; try{localStorage.setItem(SAVE_KEY+'-snd',soundOn?'1':'0');}catch(e){} AU.init(); AU.ambient(); updSnd(); });

function hint2(){
  const f=S.f; let h;
  if(!f.heardPhono) h='На столе справа — фонограф профессора. Покрути его ручку и послушай запись.';
  else if(!f.crateOpen) h='В деревянном ящике слева внизу что-то звякает.';
  else if(!f.gotGL) h=f.bellsDone?'Из-под колокола выпала шестерня — забери её.':'Сыграй на колоколах мелодию с карточки у фонографа: найди на колоколах те же знаки и ударь по ним по порядку.';
  else if(!f.gearsDone) h='Привод на стене: зубья должны сцепиться без зазора и наложения. Расстояние до мотора подходит только большой шестерне, дальше — малая, потом средняя.';
  else if(!f.sawDial) h='Циферблат засветился. Подойди к нему поближе.';
  else if(!f.lockDone) h='Код замка — четыре красные цифры в порядке точек. Изнутри башни они зеркальные: VI изнутри — это IV снаружи, XI — это IX. Набери, как видно с улицы.';
  else if(!f.heartIn2) h='Замок снят. Выбери Сердце внизу и вставь его в гнездо главного механизма.';
  else h='По лестнице спускается профессор. Коснись его.';
  say(h);
}
function hint(){
  if(S.level===2) return hint2();
  const f=S.f; let h;
  if(!f.v_letter) h='Начни с письма на столе: оно адресовано тебе.';
  else if(!f.gotGear) h = f.v_painting ? 'Выставь на настенных часах время с башни на картине — 7:20. Крути латунные рукоятки по бокам циферблата.' : 'Профессор пишет о времени на любимой картине. Рассмотри картину над столом.';
  else if(!f.gearPlaced) h='В механизме шкатулки не хватает шестерни. Выбери её внизу экрана и коснись пустой оси на передней стенке.';
  else if(!f.topOpen) h='Поверни рукоять на большой шестерне шкатулки.';
  else if(!f.ringsDone){
    if(!f.gotLens) h='Скрытое откроет красный свет. В книжном шкафу нажми книги с римскими цифрами по порядку: I, II, III, IV, V.';
    else if(!f.sawCode) h='Выбери красную линзу внизу и поводи ею по письму — особенно под подписью.';
    else h='Поворачивай кольца касанием, чтобы под красной стрелкой встали знаки из письма. Снаружи внутрь: луна, звезда, треугольник.';
  }
  else if(!f.pipesDone) h='Касайся сегментов, чтобы поворачивать трубы. Пар должен пройти от котла слева до турбины справа.';
  else if(!f.gotHeart) h='Сердце поднялось из шкатулки. Забери его.';
  else h='Выбери Сердце внизу экрана и вставь его в гнездо в центре круглого люка.';
  say(h);
}

/* ---------------- actions ---------------- */
const ACT={
  go:el=>{ AU.click(); go(el.dataset.go); },
  say:el=>{ const k=el.dataset.say;
    if(k==='letter' && S.inv.includes('lens')) { say('Попробуй выбрать красную линзу внизу экрана и провести ею над письмом.'); return; }
    say(SAY[k]); },
  start:()=>{ AU.init(); S=freshState(); S.started=true; S.t0=Date.now(); go('room');
    sayAll(['Осень 1887 года. Профессор Аврелий Брасс, лучший часовщик Нового Лондона, исчез три дня назад.',
      'Ты — его подмастерье. Едва ты вошёл, дверь мастерской захлопнулась, и замок щёлкнул. Изнутри ключа нет.',
      'Единственный другой выход — круглый латунный люк в стене. Но его механизм мёртв.',
      'На столе лежит письмо, адресованное тебе. Касайся предметов, чтобы рассмотреть их.']); },
  cont:()=>{ AU.init(); go(resumeScene && !['title','end','end2'].includes(resumeScene) ? resumeScene : 'room'); },
  knob:el=>{
    if(S.f.clockDone){ say('Часы уже пробили своё. Механизм стрелок застопорился.'); return; }
    const k=el.dataset.k; if(k==='h') S.hs++; else S.ms++;
    AU.click(); AU.tick();
    el.querySelector('.kn').style.transform=`rotate(${(k==='h'?S.hs:S.ms)*40}deg)`;
    setHands(); save();
    if(curH()===7 && curM()===20){
      S.f.clockDone=true; save();
      setTimeout(()=>AU.bell(7),350);
      setTimeout(()=>{ $('#door')?.classList.add('open'); const g=$('#cgear'); if(g) g.removeAttribute('visibility');
        document.querySelectorAll('[data-say="pendulum"]').forEach(n=>n.setAttribute('pointer-events','none')); },900);
      say('Часы бьют семь раз… Дверца маятника со скрипом отворилась!');
    }
  },
  takeGear:()=>{ if(S.f.gotGear||!S.f.clockDone) return; S.f.gotGear=true; $('#cgear')?.remove(); addItem('gear');
    say('Ты взял латунную шестерню. Она тёплая, будто недавно крутилась.'); },
  book:el=>{
    const i=+el.dataset.i, b=BOOKS[i], num=b[4];
    if(S.f.shelfDone){ say(num ? 'Книга утоплена в полку. Механизм шкафа уже сработал.' : b[5]); return; }
    if(!num){ AU.click(); say(b[5]); return; }
    if(num<=S.shelf){ say('Эта книга уже вдавлена.'); return; }
    if(num===S.shelf+1){
      S.shelf++; el.classList.add('in'); AU.click(); AU.tick(); save();
      if(S.shelf===5){ S.f.shelfDone=true; save(); setTimeout(()=>{ AU.whirr(); },200);
        setTimeout(()=>{ render(); AU.chime(); say('Внутри шкафа что-то провернулось, и нижний ящик выехал наружу!'); },900); }
    } else {
      S.shelf=0; save(); AU.clank();
      document.querySelectorAll('.book.in').forEach(n=>n.classList.remove('in'));
      say('Щёлк! Все книги выскочили обратно. Порядок неверный.');
    }
  },
  takeLens:()=>{ if(S.f.gotLens) return; S.f.gotLens=true; addItem('lens'); render(); say('Красная линза в латунной оправе. «Скрытое откроет лишь красный свет»…'); },
  socket:()=>{
    if(S.sel==='gear'){ removeItem('gear'); S.f.gearPlaced=true; save(); AU.click(); AU.clank(); render(); say('Шестерня встала на ось и сцепилась с соседними. Теперь можно крутить рукоять.'); }
    else if(S.inv.includes('gear')) say('Пустая ось. Выбери шестерню внизу экрана, затем коснись оси.');
    else say('Пустая ось. В передаче явно не хватает одной шестерни.');
  },
  boxCrank:()=>{
    const f=S.f, tr=$('#train');
    if(!f.gearPlaced){ AU.clank(); const g=$('#g1'); g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake');
      say('Рукоять заедает: в передаче не хватает звена.'); return; }
    if(f.topOpen){ say('Механизм уже провернулся. Крышка открыта.'); return; }
    tr.classList.add('run'); AU.whirr();
    setTimeout(()=>{ f.topOpen=true; save(); tr.classList.remove('run'); AU.clank(); render(); AU.chime();
      say('Латунная пластина на крышке отъехала. Под ней — три вращающихся кольца со знаками.'); },2000);
  },
  ring:el=>{
    if(S.f.ringsDone) return;
    const i=+el.dataset.i; S.rs[i]++; el.style.transform=`rotate(${-S.rs[i]*60}deg)`; AU.click(); save();
    const ok=RINGS.every((r,k)=>r[S.rs[k]%6]===CODE[k]);
    if(ok){ S.f.ringsDone=true; save();
      setTimeout(()=>{ AU.chime(); $('#medal')?.classList.add('turn'); },450);
      setTimeout(()=>{ go('box'); AU.clank(); say('Кольца встали на место, и крышка шкатулки откинулась! Внутри — паровой контур.'); },2100); }
  },
  pipe:el=>{
    if(S.f.pipesDone) return;
    const i=+el.dataset.i; S.pr[i]++; el.querySelector('.prot').style.transform=`rotate(${S.pr[i]*90}deg)`; AU.click(); save();
    if(updatePipes()){
      S.f.pipesDone=true; save(); AU.hiss();
      setTimeout(()=>{ $('#turb')?.classList.add('on'); const n=$('#pneedle'); if(n) n.style.transform='rotate(100deg)'; AU.whirr(); },300);
      setTimeout(()=>{ AU.chime(); go('box'); say('Пар ударил в турбину, и из глубины шкатулки медленно поднялось сияющее Сердце!'); },2600);
    }
  },
  takeHeart:()=>{ if(S.f.gotHeart) return; S.f.gotHeart=true; addItem('heart'); render(); say('Сердце Хроноса. Оно тёплое и тикает в ладони. «Сердце отворит тебе дверь»…'); },
  hsocket:()=>{
    const f=S.f;
    if(f.heartIn) return;
    if(S.sel==='heart'){
      removeItem('heart'); f.heartIn=true; save(); render(); AU.clank(); AU.chime();
      say('Сердце легло в гнездо и засияло. Люк ожил!');
      setTimeout(()=>{ $('#wheel')?.classList.add('turn'); AU.whirr(); AU.hiss(); },700);
      setTimeout(()=>{ f.doorOpen=true; $('#hdoor')?.classList.add('open'); AU.bell(3); save(); },2900);
      setTimeout(()=>{ S.tEnd=Date.now(); save(); go('end'); },4700);
    } else if(S.inv.includes('heart')) say('Гнездо в форме сердца. Выбери Сердце внизу экрана и коснись гнезда.');
    else say('В центре люка — гнездо в форме сердца. Пустое и холодное.');
  },
  toTower:()=>{ AU.init(); S.level=2; S.f.ch1=true; S.inv=['heart']; S.sel=null; S.tEnd=0; go('tower');
    sayAll(['Ты поднимаешься по винтовой лестнице. Сердце выскользнуло из гнезда люка и тихо тикает у тебя в кармане.',
      'Наверху — механический зал башни Хронос. Огромный циферблат подсвечен луной изнутри. Стрелки стоят.',
      'Главный механизм заперт тяжёлым замком с гербом Гильдии. Профессора нигде нет.',
      'На столе у стены стоит фонограф. Похоже, профессор оставил запись.']); },
  crate:()=>{ if(S.f.crateOpen){ say('Пустой ящик, в нём только солома.'); return; }
    S.f.crateOpen=true; AU.clank(); addItem('gS'); addItem('gM'); render(); say('Ты поддел крышку ящика. В соломе — две латунные шестерни: малая и средняя.'); },
  crank:()=>{
    if(S.scene!=='phono'){ return ACT.boxCrank(); }
    if(phonoPlaying) return; phonoPlaying=true; AU.click();
    $('.crk')?.classList.add('go'); $('.waves')?.classList.add('go');
    MELODY.forEach((g,i)=>setTimeout(()=>{ document.querySelectorAll('.note').forEach(n=>n.classList.remove('lit')); $('#note'+i)?.classList.add('lit');
      const b=BELLS.find(x=>x[0]===g); AU.bellTone(b[1]); },500+i*700));
    setTimeout(()=>{ phonoPlaying=false; $('.waves')?.classList.remove('go'); $('.crk')?.classList.remove('go'); document.querySelectorAll('.note').forEach(n=>n.classList.remove('lit'));
      S.f.heardPhono=true; save();
      sayAll(['«Если ты слышишь это, Сердце у тебя. Я заперт в часовой комнате, над залом. Гильдия остановила Хронос и повесила свой замок на механизм.»',
        '«Код замка я спрятал в циферблате. Но помни: изнутри башни всё читается задом наперёд.»',
        '«Привод циферблата я разобрал, чтобы Гильдия не нашла код. Две шестерни — в ящике, третью охраняют колокола. Они откроются песне с этого валика.»',
        '«Знаки песни — на карточке. Сыграй их на колоколах по порядку. Удачи, мой друг.»']); },500+MELODY.length*700+600);
  },
  bell:el=>{
    const i=+el.dataset.i; el.classList.remove('ring'); void el.getBoundingClientRect(); el.classList.add('ring'); AU.bellTone(BELLS[i][1]);
    if(S.f.bellsDone) return;
    S.bellSeq=(S.bellSeq||[]).concat(BELLS[i][0]).slice(-5); save();
    if(S.bellSeq.join()===MELODY.join()){ S.f.bellsDone=true; save();
      setTimeout(()=>{ AU.clank(); render(); AU.chime(); say('Колокола отозвались эхом, и из-под самого большого со звоном выпала большая шестерня!'); },1300); }
  },
  takeGL:()=>{ if(S.f.gotGL) return; S.f.gotGL=true; addItem('gL'); render(); say('Большая шестерня, двадцать зубьев. Теперь все три у тебя.'); },
  peg:el=>{
    const i=+el.dataset.i, f=S.f; if(f.gearsDone) return;
    if(S.pegs[i]){ S.inv.push(S.pegs[i]); S.pegs[i]=null; AU.click(); save(); render(); return; }
    if(!['gS','gM','gL'].includes(S.sel)){ say(S.inv.some(x=>x[0]==='g')?'Пустая ось. Выбери шестерню внизу экрана, затем коснись оси.':'Пустая ось. Шестерни нужно ещё найти.'); return; }
    const id=S.sel; removeItem(id); S.pegs[i]=id; AU.click(); AU.tick(); save(); render();
    if(S.pegs.every(Boolean)){
      if(S.pegs.join()===GB.sol.join()){ f.gearsDone=true; save();
        setTimeout(()=>{ AU.whirr(); render(); },250); setTimeout(()=>{ AU.chime(); say('Зубья сцепились, привод ожил! Где-то над головой щёлкнули реле, и циферблат башни засветился.'); },900); }
      else { AU.clank(); const g=$('#gbox'); g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake'); say('Механизм заклинило: где-то зубья налезают друг на друга, где-то не достают. Коснись шестерни, чтобы снять её.'); }
    }
  },
  lockw:el=>{
    if(S.f.lockDone) return; const i=+el.dataset.i; S.lk[i]=S.lk[i]%12+1; $('#lw'+i).textContent=RN[S.lk[i]%12]; AU.click(); save();
    if(S.lk.join()===LOCK_CODE.join()){ S.f.lockDone=true; save(); AU.clank(); $('.shackle')?.classList.add('open'); AU.chime();
      setTimeout(()=>{ go('core'); say('Дужка замка отскочила, и решётка главного механизма откинулась.'); },1500); }
  },
  core:()=>{
    const f=S.f;
    if(!f.lockDone){ go('lock'); if(!f.sawDial) say('Замок Гильдии: четыре колеса с римскими цифрами. Код где-то в башне.'); return; }
    if(f.heartIn2) return;
    if(S.sel==='heart'){
      removeItem('heart'); f.heartIn2=true; save(); render(); AU.clank(); AU.chime();
      say('Сердце легло в гнездо. Огромное колесо дрогнуло и пошло!');
      setTimeout(()=>AU.bell(6),900);
      setTimeout(()=>{ f.towerOn=true; save(); go('tower'); AU.hiss();
        sayAll(['Башня ожила: колёса пошли, стрелки двинулись, над городом поплыл бой часов.','Наверху скрипнул люк. По лестнице спускается профессор Брасс! Коснись его.']); },4200);
    } else if(S.inv.includes('heart')) say('Гнездо в форме сердца. Выбери Сердце внизу экрана и коснись гнезда.');
    else say('Гнездо в форме сердца. Пустое.');
  },
  prof:()=>{ S.tEnd=Date.now(); save(); go('end2'); },
  wheel:()=>{ if(S.f.heartIn) return; AU.clank(); const w=$('#wheel'); w.classList.remove('shake'); void w.getBoundingClientRect(); w.classList.add('shake');
    say('Колесо не поддаётся ни на миллиметр. Механизму не хватает сердца.'); }
};
sceneG.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!msgQueue.length && !msgEl.hidden) hideMsg();
  if(t && ACT[t.dataset.act]) ACT[t.dataset.act](t,e);
});
sceneG.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const t=e.target.closest('[data-act]'); if(t){ e.preventDefault(); ACT[t.dataset.act]?.(t,e); } } });

/* ---------------- boot ---------------- */
updSnd();
let resumeScene = S.scene;
S.scene = 'title';
render();
buildTextures(p=>{ texProgress=p; const b=$('#texBar'); if(b) b.setAttribute('width',f1(336*p)); }).then(()=>{ if(S.scene==='title') render(); });
</script>
</body>
</html>
