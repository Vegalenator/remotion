<title>Кукла в рюшах</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: a full-bleed turntable stage; caption and view chips float over it like the labels on a turnaround sheet. */
  :root {
    --stage-a: #b3ada7;          /* studio grey from the reference sheets */
    --stage-b: #8f8983;
    --ink: #2a2224;
    --ink-soft: #5d5052;
    --paper: rgba(244, 238, 231, 0.86);
    --line: rgba(42, 34, 36, 0.18);
    --garnet: #8f2734;           /* the ribbon satin */
    --garnet-ink: #fbeff0;
    --font-display: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage-a: #3a2e30; --stage-b: #160f11; --ink: #f1e6e2; --ink-soft: #bba9a6;
      --paper: rgba(30, 22, 24, 0.82); --line: rgba(241, 230, 226, 0.16);
      --garnet: #c0485a; --garnet-ink: #1a0e10; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --stage-a: #3a2e30; --stage-b: #160f11; --ink: #f1e6e2; --ink-soft: #bba9a6;
    --paper: rgba(30, 22, 24, 0.82); --line: rgba(241, 230, 226, 0.16);
    --garnet: #c0485a; --garnet-ink: #1a0e10; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--stage-b); color: var(--ink); font-family: var(--font-body);
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 38%, var(--stage-a), var(--stage-b));
  }
  #stage.dark { background: radial-gradient(110% 90% at 50% 40%, #3b2a29, #120b0c); }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #stage canvas:focus-visible { outline: 2px solid var(--garnet); outline-offset: -4px; }

  .hud {
    position: fixed; left: 0; right: 0; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hud > * { pointer-events: auto; }
  .top { top: 0; padding-block: calc(env(safe-area-inset-top, 0px) + 16px) 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .title h1 {
    margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 3.4vw, 32px);
    letter-spacing: 0.08em; line-height: 1.05; text-wrap: balance;
  }
  .title p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); max-width: 46ch; }
  .meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.6; }

  .bottom { bottom: 0; padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .caption {
    font-family: var(--font-display); font-weight: 500; font-size: clamp(15px, 2vw, 19px);
    letter-spacing: 0.22em; color: var(--ink); pointer-events: none;
  }
  .bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
    backdrop-filter: blur(8px);
  }
  .bar .sep { width: 1px; background: var(--line); margin: 4px 2px; }
  .bar button {
    font: 500 12.5px/1 var(--font-body); color: var(--ink); background: transparent;
    border: 1px solid transparent; border-radius: 9px; padding: 9px 11px; cursor: pointer;
    letter-spacing: 0.02em;
  }
  .bar button:hover { border-color: var(--line); }
  .bar button:focus-visible { outline: 2px solid var(--garnet); outline-offset: 1px; }
  .bar button[aria-pressed="true"] { background: var(--garnet); color: var(--garnet-ink); }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-family: var(--font-display); letter-spacing: 0.2em; font-size: 18px; color: var(--ink-soft);
  }
  @media (max-width: 520px) {
    .meta { display: none; }
    .bar button { padding: 8px 9px; font-size: 12px; }
  }
</style>

<div id="stage" aria-label="3D-модель куклы, вращается мышью или пальцем"></div>
<div id="loading">Загружаю модель…</div>

<header class="hud top">
  <div class="title">
    <h1>Кукла в рюшах</h1>
    <p>Реконструкция по листу разворота, виду сверху и портрету: тянуть — вращать, колесо или щипок — приблизить.</p>
  </div>
  <div class="meta" id="meta"></div>
</header>

<footer class="hud bottom">
  <div class="caption" id="caption">ИЗОМЕТРИЯ СПЕРЕДИ</div>
  <nav class="bar" aria-label="Ракурсы">
    <button id="v-front" data-view="front">Спереди</button>
    <button id="v-right" data-view="right">Правый бок</button>
    <button id="v-back" data-view="back">Сзади</button>
    <button id="v-left" data-view="left">Левый бок</button>
    <button id="v-top" data-view="top">Сверху</button>
    <button id="v-isoF" data-view="isoF">Изометрия спереди</button>
    <button id="v-isoB" data-view="isoB">Изометрия сзади</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="t-spin" aria-pressed="false">Вращение</button>
    <button id="t-bg" aria-pressed="false">Тёмный фон</button>
  </nav>
</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
// the texture already carries the artwork's own shading, so colours pass through untouched
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.tabIndex = 0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.12;

// narrow lens: the named views read almost like the orthographic turnaround sheets
const FOV = 16;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1;
controls.maxDistance = 16;
controls.autoRotateSpeed = 1.6;

scene.add(new THREE.HemisphereLight('#fff4ea', '#6b5a55', 0.3));
const key = new THREE.DirectionalLight('#fff0e0', 0.55);
key.position.set(1.3, 4, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -0.8, right: 0.8, top: 1.9, bottom: -0.2, near: 0.5, far: 8 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.01;
scene.add(key);
const fill = new THREE.DirectionalLight('#e9ecff', 0.15);
fill.position.set(-2.2, 1.6, 1.4);
scene.add(fill);
const rim = new THREE.DirectionalLight('#ffe0c8', 0.3);
rim.position.set(0.4, 2.6, -3);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const VIEWS = {
  front: { label: 'СПЕРЕДИ', pos: [0, 0.84, 7.4] },
  right: { label: 'ПРАВЫЙ БОК', pos: [-7.4, 0.84, 0] },
  back: { label: 'СЗАДИ', pos: [0, 0.84, -7.4] },
  left: { label: 'ЛЕВЫЙ БОК', pos: [7.4, 0.84, 0] },
  top: { label: 'ВИД СВЕРХУ', pos: [0, 6.1, 1.08], target: [0, 0.75, 0] },   // the top sheet is tilted ~10° toward the front
  isoF: { label: 'ИЗОМЕТРИЯ СПЕРЕДИ', pos: [2.6, 3.9, 5.8] },
  isoB: { label: 'ИЗОМЕТРИЯ СЗАДИ', pos: [-2.6, 3.9, -5.8] },
};
const TARGET = [0, 0.8, 0];
let tween = null;
function setView(name, instant = false) {
  const v = VIEWS[name];
  document.getElementById('caption').textContent = v.label;
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const toPos = new THREE.Vector3(...v.pos), toTarget = new THREE.Vector3(...(v.target || TARGET));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce) { camera.position.copy(toPos); controls.target.copy(toTarget); controls.update(); tween = null; return; }
  tween = { t0: performance.now(), fromPos: camera.position.clone(), fromTarget: controls.target.clone(), toPos, toTarget };
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
controls.addEventListener('start', () => {
  tween = null;
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  document.getElementById('caption').textContent = 'СВОБОДНЫЙ РАКУРС';
});
const spinBtn = document.getElementById('t-spin');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
});
const bgBtn = document.getElementById('t-bg');
bgBtn.addEventListener('click', () => {
  const on = stage.classList.toggle('dark');
  bgBtn.setAttribute('aria-pressed', String(on));
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the whole doll in frame on narrow screens
  camera.fov = w / h < 0.75 ? FOV * Math.min(1.7, 0.75 / (w / h)) : FOV;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
setView('front', true);

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
renderer.setAnimationLoop((now) => {
  if (tween) {
    const t = Math.min(1, (now - tween.t0) / 900), k = ease(t);
    camera.position.lerpVectors(tween.fromPos, tween.toPos, k);
    controls.target.lerpVectors(tween.fromTarget, tween.toTarget, k);
    if (t >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});

new GLTFLoader().load('./doll.glb', (gltf) => {
  const doll = gltf.scene;
  let verts = 0;
  doll.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    // mostly self-lit so the painted light of the sheets survives; the scene lights add a little real form
    m.emissiveMap = m.map;
    m.emissive = new THREE.Color(1, 1, 1);
    m.emissiveIntensity = 0.72;
    o.castShadow = true;
    verts += o.geometry.attributes.position.count;
  });
  scene.add(doll);
  window.doll = doll;
  document.getElementById('meta').innerHTML =
    `${verts.toLocaleString('ru-RU')} вершин · текстура 4096²<br>рост 1,62 м · 5 ракурсов + портрет`;
  document.getElementById('loading').hidden = true;
  window.viewer = { renderer, scene, camera, controls, setView };
  window.dollReady = true;
}, undefined, () => {
  document.getElementById('loading').textContent = 'Не удалось загрузить модель. Обнови страницу.';
});
</script>
